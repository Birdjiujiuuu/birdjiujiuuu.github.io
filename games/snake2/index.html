<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
:root{
  --text:#e6edf3;
  --muted:#8b98a9;
  --border:rgba(255,255,255,.08);
  --green:#39d353;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(1200px 700px at 50% -15%, #16233a 0%, #0b0f17 55%, #070a10 100%);
  color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

.game{width:100%;max-width:820px;}

/* ---------- 顶部信息栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:14px;
}
h1{
  font-size:20px;letter-spacing:3px;font-weight:800;
  background:linear-gradient(90deg,#39d353,#58a6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hud{display:flex;gap:10px;}
.stat{
  display:flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  font-size:13px;color:var(--muted);
}
.stat b{
  color:#fff;font-size:15px;font-variant-numeric:tabular-nums;
  transition:color .2s;
}
.stat b.pop{color:var(--green);}

/* ---------- 画布区 ---------- */
.stage{
  position:relative;
  width:100%;
  aspect-ratio:800/600;
  border-radius:16px;
  overflow:hidden;
  background:#0d131f;
  box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px var(--border);
}
canvas{display:block;width:100%;height:100%;}

/* ---------- 遮罩层 ---------- */
.overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,10,16,.74);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  transition:opacity .22s ease;
  padding:20px;
}
.overlay.hide{opacity:0;pointer-events:none;}
.card{
  text-align:center;
  padding:26px 38px;
  border-radius:16px;
  background:rgba(18,27,42,.92);
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pop .25s cubic-bezier(.2,.9,.3,1.3);
  max-width:90%;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-size:22px;margin-bottom:10px;letter-spacing:2px;}
.card p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7;}

/* ---------- 按钮 ---------- */
.btn{
  font-family:inherit;font-size:14px;cursor:pointer;
  padding:10px 24px;border-radius:10px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#1b2739,#131b28);
  color:var(--text);
  transition:transform .15s, background .2s, box-shadow .2s;
}
.btn:hover{background:#22314a;transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.98);}
.btn.primary{
  background:linear-gradient(180deg,#39d353,#2ea043);
  border-color:transparent;color:#052b10;font-weight:800;
  box-shadow:0 8px 22px rgba(57,211,83,.28);
}
.btn.primary:hover{background:linear-gradient(180deg,#4ae065,#31b24b);}

/* ---------- 底部控制区 ---------- */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-top:14px;flex-wrap:wrap;
}
.pad{
  display:grid;
  grid-template-columns:repeat(3,46px);
  grid-template-rows:repeat(3,46px);
  gap:6px;
}
.key{
  font-family:inherit;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,#1b2739,#131b28);
  color:var(--text);
  transition:transform .12s, background .15s;
}
.key:hover{background:#22314a;}
.key:active{transform:scale(.92);background:#2a3c5a;}
.key[data-dir="up"]{grid-area:1/2;}
.key[data-dir="left"]{grid-area:2/1;}
.key[data-dir="down"]{grid-area:3/2;}
.key[data-dir="right"]{grid-area:2/3;}

.actions{display:flex;gap:10px;flex-wrap:wrap;}

.tips{
  margin-top:12px;text-align:center;
  font-size:12px;color:#5d6b7d;letter-spacing:.5px;
}

@media (max-width:560px){
  body{padding:12px;}
  h1{font-size:17px;}
  .stat{padding:5px 10px;font-size:12px;}
  .stat b{font-size:13px;}
  .pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);}
  .btn{padding:9px 16px;font-size:13px;}
}
</style>
</head>
<body>

<div class="game">

  <div class="topbar">
    <h1>贪 吃 蛇</h1>
    <div class="hud">
      <span class="stat">得分 <b id="score">0</b></span>
      <span class="stat">最高 <b id="best">0</b></span>
      <span class="stat">长度 <b id="len">4</b></span>
    </div>
  </div>

  <div class="stage">
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovTitle">准备开始</h2>
        <p id="ovText">方向键 / WASD 控制方向 · 空格暂停</p>
        <button class="btn primary" id="ovBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="pad">
      <button class="key" data-dir="up"    aria-label="上">↑</button>
      <button class="key" data-dir="left"  aria-label="左">←</button>
      <button class="key" data-dir="down"  aria-label="下">↓</button>
      <button class="key" data-dir="right" aria-label="右">→</button>
    </div>
    <div class="actions">
      <button class="btn" id="pauseBtn">暂停</button>
      <button class="btn" id="restartBtn">重新开始</button>
    </div>
  </div>

  <p class="tips">↑ ↓ ← → / W A S D 移动 &nbsp;·&nbsp; 空格 暂停 &nbsp;·&nbsp; 手机可滑动屏幕</p>
</div>

<script>
(function () {
  'use strict';

  /* ========== 常量 ========== */
  const BLOCK = 20;          // 单格像素
  const COLS  = 40;          // 列数
  const ROWS  = 30;          // 行数
  const W = COLS * BLOCK;
  const H = ROWS * BLOCK;

  const BASE_STEP = 140;     // 初始每步毫秒
  const MIN_STEP  = 70;      // 最快每步毫秒
  const START_LEN = 4;       // 初始蛇长

  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  /* ========== DOM ========== */
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');
  const lenEl    = document.getElementById('len');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  /* ========== 高清屏适配 ========== */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* ========== 游戏状态 ========== */
  let snake   = [];      // [{x,y}] 索引 0 为蛇头，坐标为格子坐标
  let dir     = DIRS.right;
  let queue   = [];      // 输入缓冲队列
  let food    = null;    // {x,y}
  let score   = 0;
  let best    = parseInt(localStorage.getItem('snake-best') || '0', 10) || 0;
  let state   = 'ready'; // ready | running | paused | over
  let lastTime = 0;
  let acc      = 0;

  bestEl.textContent = best;

  /* ========== 工具函数 ========== */
  function roundRect(c, x, y, w, h, r) {
    if (c.roundRect) {
      c.beginPath();
      c.roundRect(x, y, w, h, r);
      return;
    }
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y,     x + w, y + h, r);
    c.arcTo(x + w, y + h, x,     y + h, r);
    c.arcTo(x,     y + h, x,     y,     r);
    c.arcTo(x,     y,     x + w, y,     r);
    c.closePath();
  }

  function stepMs() {
    return Math.max(MIN_STEP, BASE_STEP - Math.floor(score / 3) * 8);
  }

  /* ========== 界面 ========== */
  function updateHud() {
    scoreEl.textContent = score;
    lenEl.textContent   = snake.length;
  }

  function showOverlay(title, text, btnText) {
    ovTitle.textContent = title;
    ovText.textContent  = text;
    ovBtn.textContent   = btnText;
    overlay.classList.remove('hide');
    // 重播动画
    const card = overlay.firstElementChild;
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = '';
  }

  function hideOverlay() {
    overlay.classList.add('hide');
  }

  /* ========== 初始化 ========== */
  function reset() {
    snake = [];
    const sy = Math.floor(ROWS / 2);
    const sx = Math.floor(COLS / 2) - 1;
    for (let i = 0; i < START_LEN; i++) {
      snake.push({ x: sx - i, y: sy });
    }
    dir   = DIRS.right;
    queue = [];
    score = 0;
    acc   = 0;
    spawnFood();
    updateHud();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  /* ========== 流程控制 ========== */
  function start() {
    state = 'running';
    acc = 0;
    pauseBtn.textContent = '暂停';
    hideOverlay();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      pauseBtn.textContent = '继续';
      showOverlay('已暂停', '按 空格 或 点击按钮继续游戏', '继续游戏');
    } else if (state === 'paused') {
      state = 'running';
      acc = 0;
      pauseBtn.textContent = '暂停';
      hideOverlay();
    }
  }

  function gameOver(reason) {
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
    }
    pauseBtn.textContent = '暂停';
    showOverlay('游戏结束', reason + ' · 本局得分 ' + score, '再来一局');
  }

  function primaryAction() {
    if (state === 'paused') { togglePause(); return; }
    if (state === 'over')   reset();
    if (state !== 'running') start();
  }

  /* ========== 逻辑更新 ========== */
  function update() {
    // 取出一个缓冲方向（不能 180° 掉头）
    if (queue.length) {
      const nd = queue.shift();
      if (!(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
    }

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver('撞到墙壁了');
      return;
    }

    // 撞自己（不吃食物时尾巴会移开，所以最后一节不算）
    const willEat = food && head.x === food.x && head.y === food.y;
    const body = willEat ? snake : snake.slice(0, snake.length - 1);
    for (let i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) {
        gameOver('咬到自己了');
        return;
      }
    }

    snake.unshift(head);
    if (willEat) {
      score++;
      updateHud();
      spawnFood();
      // 得分跳动提示
      scoreEl.classList.add('pop');
      setTimeout(() => scoreEl.classList.remove('pop'), 160);
    } else {
      snake.pop();
    }
  }

  /* ========== 渲染 ========== */
  function drawSnake() {
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const p = n > 1 ? i / (n - 1) : 0;      // 0=头 1=尾
      const pad = 1.5;
      const x = s.x * BLOCK + pad;
      const y = s.y * BLOCK + pad;
      const w = BLOCK - pad * 2;
      const h = BLOCK - pad * 2;

      const hue   = 140 + p * 45;             // 头绿 -> 尾青
      const light = 54 - p * 14;

      roundRect(ctx, x, y, w, h, 6);

      if (i === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(57,211,83,.75)';
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = 'hsl(' + hue + ',78%,' + light + '%)';
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = 'hsl(' + hue + ',68%,' + light + '%)';
        ctx.fill();
      }
    }
    drawEyes();
  }

  function drawEyes() {
    const s  = snake[0];
    if (!s) return;
    const cx = s.x * BLOCK + BLOCK / 2;
    const cy = s.y * BLOCK + BLOCK / 2;
    const ex = dir.x, ey = dir.y;
    const px = -ey,   py = ex;          // 垂直方向
    const fwd = 3.5, side = 4;

    ctx.fillStyle = '#06121e';
    [1, -1].forEach(function (sign) {
      ctx.beginPath();
      ctx.arc(cx + ex * fwd + px * side * sign,
              cy + ey * fwd + py * side * sign,
              2.3, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawFood(t) {
    if (!food) return;
    const cx = food.x * BLOCK + BLOCK / 2;
    const cy = food.y * BLOCK + BLOCK / 2;
    const pulse = 1 + Math.sin(t / 180) * 0.07;
    const r = (BLOCK / 2 - 3) * pulse;

    // 光晕
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, BLOCK * 1.5);
    g.addColorStop(0, 'rgba(255,90,90,.32)');
    g.addColorStop(1, 'rgba(255,90,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, BLOCK * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 果身
    ctx.fillStyle = '#ff5a5a';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.32, cy - r * 0.36, r * 0.26, 0, Math.PI * 2);
    ctx.fill();
  }

  function render(t) {
    // 背景
    ctx.fillStyle = '#0d131f';
    ctx.fillRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) {
      ctx.moveTo(x * BLOCK + 0.5, 0);
      ctx.lineTo(x * BLOCK + 0.5, H);
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * BLOCK + 0.5);
      ctx.lineTo(W, y * BLOCK + 0.5);
    }
    ctx.stroke();

    drawFood(t);
    drawSnake();
  }

  /* ========== 主循环 ========== */
  function loop(t) {
    requestAnimationFrame(loop);

    if (lastTime === 0) lastTime = t;
    let dt = t - lastTime;
    lastTime = t;
    if (dt > 300) dt = 300;   // 切后台回来时防止追帧爆炸

    if (state === 'running') {
      acc += dt;
      const step = stepMs();
      let guard = 0;
      while (acc >= step && state === 'running' && guard++ < 5) {
        acc -= step;
        update();
      }
      if (acc > step * 5) acc = 0;
    } else {
      acc = 0;
    }

    render(t);
  }

  /* ========== 输入 ========== */
  function handleDirection(name) {
    if (state === 'ready') {
      start();
    } else if (state === 'over') {
      reset();
      start();
    } else if (state === 'paused') {
      return;
    }

    const d = DIRS[name];
    if (!d) return;

    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;  // 反向
    if (d.x === last.x  && d.y === last.y)  return;  // 重复
    if (queue.length < 3) queue.push(d);
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      if (state === 'ready' || state === 'over') primaryAction();
      else togglePause();
      return;
    }
    if (k === 'p' || k === 'P' || k === 'Escape') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (k === 'Enter') {
      primaryAction();
      return;
    }

    const name = KEYMAP[k];
    if (name) {
      e.preventDefault();
      handleDirection(name);
    }
  });

  // 虚拟方向键
  document.querySelectorAll('[data-dir]').forEach(function (btn) {
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      handleDirection(btn.dataset.dir);
    });
  });

  // 触摸滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t  = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      handleDirection(dx > 0 ? 'right' : 'left');
    } else {
      handleDirection(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  // 按钮
  ovBtn.addEventListener('click', primaryAction);
  pauseBtn.addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', function () {
    reset();
    start();
  });

  // 切到后台自动暂停
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'running') togglePause();
  });

  /* ========== 启动 ========== */
  reset();
  state = 'ready';
  showOverlay('准备开始', '方向键 / WASD 控制方向 · 空格暂停', '开始游戏');
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
